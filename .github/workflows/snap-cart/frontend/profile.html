<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My account — Snap Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="section-head"><div><h2>My account</h2><div class="sub">Profile and order history</div></div></div>
    <div class="two-col">
      <section class="panel">
        <h3>Profile</h3>
        <form id="profileForm" class="form" novalidate>
          <label style="display:block"><span>Full name</span><input class="input" name="name"><div class="field-error" data-err="name"></div></label>
          <label style="display:block;margin-top:12px"><span>Email</span><input class="input" name="email" disabled></label>
          <label style="display:block;margin-top:12px"><span>Mobile number</span><input class="input" name="phone" placeholder="10-digit mobile"><div class="field-error" data-err="phone"></div></label>
          <div class="field-error" data-err="_form"></div>
          <div class="form-actions"><button class="btn" type="submit">Save changes</button><button class="btn btn-danger" type="button" id="logoutBtn">Logout</button></div>
        </form>
      </section>
      <section class="panel">
        <h3>Order history</h3>
        <div id="orderList"><div class="spinner">Loading orders…</div></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
